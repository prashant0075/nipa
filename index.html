<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIPA Digital - Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <section class="login-section">

      <div class="login-box">

        <img src="nipa-logo.png" class="logo" alt="NIPA Digital">

        <h1>User Login</h1>

        <form id="loginForm">

          <!-- User ID -->
          <div class="input-box">

            <input type="text" id="userId" placeholder="Enter user ID" autocomplete="username" required>

            <span class="icon">👤</span>

          </div>


          <!-- Password -->
          <div class="input-box">

            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>

            <button type="button" class="password-btn" id="togglePassword">
              🔑
            </button>

          </div>


          <!-- Login -->
          <button type="submit" class="login-btn">
            Login
          </button>


          <!-- Forgot password -->
          <p class="forgot">
            Forgot password?
            <a href="#" id="forgotPassword">
              click here
            </a>
          </p>


          <p id="message"></p>

        </form>

      </div>

    </section>


    <!-- Footer -->
    <footer>

      © Copyright 2026 - NIPA: NIPA GENX ELECTRONIC
      RESOURCES AND SOLUTIONS P. LTD.
      All Rights Reserved.

    </footer>

  </div>


  <script src="script.js"></script>

</body>

</html>
