<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz</title>
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <nav class="nav-bar">
        <div>Welcome <span>Kishor</span></div>
    </nav>
    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
    </div>
    <div class="lang">
        <select name="" id="">
            <option value="">English</option>
            <option value="">Hindi</option>
        </select>
    </div>
    <div class="clock">
        <h2>Time Left</h2>
        <i class="fa-regular fa-clock"></i>
        <h2 id="timer">30:00</h2>
    </div>

    <div class="quiz-box">
        <div class="q">
            <div id="questionNumber"></div>
        <span id="question"></span>
        </div>

        <div id="options"></div>
        <hr>
        <div class="buttons">
            <button id="reviewBtn">Mark for Review</button>
        <button id="nextBtn">Save & Next</button>

        </div>

    </div>

        <footer class="footer">

        © Copyright 2026 - NIPA:
        NIPA GENX ELECTRONIC RESOURCES
        AND SOLUTIONS P. LTD.
        All Rights Reserved.

    </footer>

    <script>
        const camera = document.getElementById("camera");

        async function startCamera() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user"
                    },
                    audio: false
                });

                camera.srcObject = stream;

            } catch (error) {

                console.error("Camera access denied:", error);

                alert("Camera permission is required to start the quiz.");
            }
        }


        // Camera start
        startCamera();




        let timeLeft = 30 * 60; // 30 minutes = 1800 seconds

        const timer = document.getElementById("timer");

        const countdown = setInterval(function () {

            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            // 01:05 jaisa format
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            timer.textContent = `${minutes}:${seconds}`;

            // Time khatam
            if (timeLeft <= 0) {

                clearInterval(countdown);

                timer.textContent = "00:00";

                // Yahan quiz automatically submit karwa sakte ho
                alert("Time's up!");

            }

            timeLeft--;

        }, 1000);

        const questions = [
              {
    question: "Agricultural Economics is mainly concerned with the application of economic principles to:",
    options: ["Industry", "Agriculture", "Banking", "Transport"],
    answer: "Agriculture"
  },
  {
    question: "The basic economic problem arises because resources are:",
    options: ["Unlimited", "Scarce", "Free", "Abundant"],
    answer: "Scarce"
  },
  {
    question: "The utility of a commodity means its:",
    options: ["Price", "Usefulness", "Cost", "Supply"],
    answer: "Usefulness"
  },
  {
    question: "According to the law of demand, when price increases, demand generally:",
    options: ["Increases", "Decreases", "Remains constant", "Doubles"],
    answer: "Decreases"
  },
  {
    question: "A demand curve generally slopes:",
    options: ["Upward", "Downward", "Vertical only", "Horizontal only"],
    answer: "Downward"
  },
  {
    question: "Supply means the quantity of a commodity offered for sale at a given:",
    options: ["Income", "Price", "Cost", "Profit"],
    answer: "Price"
  },
  {
    question: "The supply curve generally slopes:",
    options: ["Downward", "Upward", "Horizontally", "Randomly"],
    answer: "Upward"
  },
  {
    question: "Elasticity of demand measures the responsiveness of demand to a change in:",
    options: ["Supply", "Price or other factors", "Production only", "Population only"],
    answer: "Price or other factors"
  },
  {
    question: "When percentage change in demand is greater than percentage change in price, demand is:",
    options: ["Inelastic", "Elastic", "Unitary elastic", "Perfectly inelastic"],
    answer: "Elastic"
  },
  {
    question: "Marginal utility means the additional utility obtained from:",
    options: ["All units", "One additional unit", "First unit only", "Last five units"],
    answer: "One additional unit"
  },
  {
    question: "The law of diminishing marginal utility states that marginal utility generally:",
    options: ["Increases continuously", "Decreases with additional consumption", "Remains constant", "Becomes infinite"],
    answer: "Decreases with additional consumption"
  },
  {
    question: "Consumer equilibrium is achieved when the consumer gets:",
    options: ["Minimum satisfaction", "Maximum satisfaction", "Minimum income", "Maximum expenditure"],
    answer: "Maximum satisfaction"
  },
  {
    question: "The principle of equi-marginal utility is also known as the law of:",
    options: ["Demand", "Substitution", "Variable proportion", "Supply"],
    answer: "Substitution"
  },
  {
    question: "Production means the creation of:",
    options: ["Money", "Utility", "Demand", "Inflation"],
    answer: "Utility"
  },
  {
    question: "Land, labour, capital and entrepreneur are known as:",
    options: ["Factors of production", "Factors of demand", "Factors of supply", "Consumer goods"],
    answer: "Factors of production"
  },
  {
    question: "Which of the following is a fixed factor in the short run?",
    options: ["Land", "Fertilizer", "Seed", "Labour"],
    answer: "Land"
  },
  {
    question: "The law of variable proportions applies when:",
    options: ["All factors are fixed", "One factor is variable and others are fixed", "All factors are variable", "No factor is used"],
    answer: "One factor is variable and others are fixed"
  },
  {
    question: "Total Product refers to:",
    options: ["Output produced by all units of a variable factor", "Cost of production", "Price of output", "Total income"],
    answer: "Output produced by all units of a variable factor"
  },
  {
    question: "Marginal Product is the change in total product due to one additional unit of:",
    options: ["Fixed factor", "Variable factor", "Land only", "Capital only"],
    answer: "Variable factor"
  },
  {
    question: "Average Product is calculated as:",
    options: ["Total Product ÷ Variable Factor", "Variable Factor ÷ Total Product", "Total Cost ÷ Output", "Total Revenue ÷ Output"],
    answer: "Total Product ÷ Variable Factor"
  },
  {
    question: "The cost that does not change with the level of output in the short run is called:",
    options: ["Variable cost", "Fixed cost", "Marginal cost", "Opportunity cost"],
    answer: "Fixed cost"
  },
  {
    question: "Cost which changes with the level of production is called:",
    options: ["Fixed cost", "Variable cost", "Sunk cost", "Social cost"],
    answer: "Variable cost"
  },
  {
    question: "Marginal Cost is the addition to total cost caused by producing:",
    options: ["One additional unit", "All units", "No unit", "Fixed output"],
    answer: "One additional unit"
  },
  {
    question: "Revenue obtained from selling one additional unit is called:",
    options: ["Total revenue", "Average revenue", "Marginal revenue", "Net revenue"],
    answer: "Marginal revenue"
  },
  {
    question: "Profit is equal to:",
    options: ["Cost − Revenue", "Revenue − Cost", "Cost + Revenue", "Revenue ÷ Cost"],
    answer: "Revenue − Cost"
  },
  {
    question: "Inflation refers to a sustained increase in the general:",
    options: ["Production level", "Price level", "Employment level", "Export level"],
    answer: "Price level"
  },
  {
    question: "A major cause of demand-pull inflation is:",
    options: ["Excess demand", "Low demand", "Excess supply", "Fall in population"],
    answer: "Excess demand"
  },
  {
    question: "Deflation refers to a sustained fall in the general:",
    options: ["Price level", "Production cost", "Population", "Employment"],
    answer: "Price level"
  },
  {
    question: "National income is the total income earned by the factors of production of a:",
    options: ["Firm", "Country", "Farm", "Household only"],
    answer: "Country"
  },
  {
    question: "GDP stands for:",
    options: ["Gross Domestic Product", "General Domestic Price", "Gross Development Production", "General Development Product"],
    answer: "Gross Domestic Product"
  },
  {
    question: "Market is a place where buyers and sellers:",
    options: ["Only produce goods", "Exchange goods and services", "Only consume goods", "Only save money"],
    answer: "Exchange goods and services"
  },
  {
    question: "Perfect competition is characterized by:",
    options: ["One seller", "Many buyers and sellers", "Two sellers", "No buyers"],
    answer: "Many buyers and sellers"
  },
  {
    question: "A market with only one seller is called:",
    options: ["Perfect competition", "Monopoly", "Oligopoly", "Duopoly"],
    answer: "Monopoly"
  },
  {
    question: "Opportunity cost means the value of the:",
    options: ["Best alternative foregone", "Total cost", "Fixed cost", "Market price"],
    answer: "Best alternative foregone"
  },
  {
    question: "Agricultural marketing deals mainly with:",
    options: ["Production only", "Movement of agricultural produce from producer to consumer", "Irrigation only", "Farm machinery only"],
    answer: "Movement of agricultural produce from producer to consumer"
  },
  {
    question: "A person who purchases agricultural produce directly from farmers for resale is generally called a:",
    options: ["Consumer", "Trader", "Labourer", "Producer"],
    answer: "Trader"
  },
  {
    question: "Farm management is mainly concerned with the efficient use of:",
    options: ["Farm resources", "Household goods", "Industrial products", "Imported goods"],
    answer: "Farm resources"
  },
  {
    question: "The main objective of farm management is to:",
    options: ["Minimize production", "Maximize returns from available resources", "Increase wastage", "Reduce farm size"],
    answer: "Maximize returns from available resources"
  },
  {
    question: "Agricultural finance refers to the provision and management of:",
    options: ["Agricultural labour", "Funds for agricultural activities", "Agricultural land", "Agricultural products"],
    answer: "Funds for agricultural activities"
  },
  {
    question: "Credit taken for purchasing seeds, fertilizers and other inputs for crop production is generally called:",
    options: ["Consumption credit", "Production credit", "Housing credit", "Personal credit"],
    answer: "Production credit"
  }
        ];

        let currentQuestion = 0;

        let userAnswers = [];


        // ===============================
        // QUIZ START TIME
        // ===============================

        const startTime = new Date();


        // ===============================
        // ELEMENTS
        // ===============================

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const nextBtn = document.getElementById("nextBtn");
        const reviewBtn = document.getElementById("reviewBtn");


        // ===============================
        // SHOW QUESTION
        // ===============================
        const questionNumberElement = document.getElementById("questionNumber");
            

        function showQuestion() {

            questionNumberElement.textContent =
                currentQuestion + 1;
            const q = questions[currentQuestion];

            questionElement.textContent = q.question;

            optionsElement.innerHTML = "";

            q.options.forEach((option, index) => {

                const label = document.createElement("label");

                label.innerHTML = `
            <input 
                type="radio" 
                name="answer" 
                value="${index}"
            >
            ${option}
        `;

                optionsElement.appendChild(label);
                optionsElement.appendChild(
                    document.createElement("br")
                );
            });


            // Last question
            if (currentQuestion === questions.length - 1) {

                nextBtn.textContent = "Submit";

            } else {

                nextBtn.textContent = "Save & Next";
            }
        }


        // ===============================
        // SAVE & NEXT / SUBMIT
        // ===============================

        nextBtn.addEventListener("click", function () {

            const selected = document.querySelector(
                'input[name="answer"]:checked'
            );


            // Answer select nahi kiya
            if (!selected) {

                alert("Please select an answer!");

                return;
            }


            // Answer save
            userAnswers[currentQuestion] = Number(selected.value);


            // ===============================
            // LAST QUESTION
            // ===============================

            if (currentQuestion === questions.length - 1) {

                const endTime = new Date();


                // Attempted questions
                const attempted = userAnswers.filter(
                    answer => answer !== undefined
                ).length;


                // Skipped questions
                const skipped = questions.length - attempted;


                // Quiz result data
                const quizResult = {

                    totalQuestions: questions.length,

                    attempted: attempted,

                    skipped: skipped,

                    startTime: startTime.toISOString(),

                    endTime: endTime.toISOString(),

                    answers: userAnswers
                };


                // Save result
                localStorage.setItem(
                    "quizResult",
                    JSON.stringify(quizResult)
                );


                // Result page
                window.location.href = "result.html";

                return;
            }


            // ===============================
            // NEXT QUESTION
            // ===============================

            currentQuestion++;

            showQuestion();
        });


        // ===============================
        // FIRST QUESTION ON PAGE LOAD
        // ===============================

        showQuestion();
    </script>
</body>

</html>
